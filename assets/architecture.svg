<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc"><title id="title">Architecture actuelle de CHamDocs</title><desc id="desc">L'interface envoie une question à FastAPI. La recherche hybride consulte SQLite, puis les passages sont transmis au modèle local Ollama. La réponse avec ses sources revient à l'interface. Docker et Kubernetes permettent le déploiement local.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#27446d" stroke-width="1.5"/></marker></defs><rect width="1000" height="370" fill="#ffffff" rx="10"/><g font-family="Avenir Next,Avenir,Segoe UI,sans-serif" font-size="17" text-anchor="middle"><g fill="#d7ebf4" stroke="#bdd8e5"><rect x="35" y="85" width="170" height="85" rx="8"/><rect x="260" y="85" width="170" height="85" rx="8"/><rect x="485" y="85" width="200" height="85" rx="8"/><rect x="740" y="85" width="215" height="85" rx="8"/><rect x="500" y="245" width="170" height="70" rx="8"/></g><g fill="#1e2d43"><text x="120" y="122">Interface</text><text x="120" y="145" font-size="12">Question et sources</text><text x="345" y="122">FastAPI</text><text x="345" y="145" font-size="12">Contrats et contrôles</text><text x="585" y="122">Recherche hybride</text><text x="585" y="145" font-size="12">Mots, sens et fusion</text><text x="847" y="122">Ollama</text><text x="847" y="145" font-size="12">Réponse depuis les passages</text><text x="585" y="275">SQLite</text><text x="585" y="297" font-size="12">Textes et vecteurs</text></g><g fill="none" stroke="#27446d" stroke-width="2" marker-end="url(#arrow)"><path d="M205 127H250"/><path d="M430 127H475"/><path d="M685 127H730"/><path d="M585 170V235"/><path d="M847 170V205H120V180"/></g><text x="480" y="226" font-size="12" fill="#617289">Réponse, références et limites</text><text x="500" y="40" font-size="13" fill="#617289">DÉPLOIEMENT LOCAL · DOCKER COMPOSE OU KUBERNETES KIND</text><text x="500" y="349" font-size="12" fill="#617289">Schéma simplifié. Les fournisseurs externes et les intégrations aux autres applications sont des évolutions prévues.</text></g></svg>
