<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
  <title id="title">Architecture actuelle de CHamDocs 0.4.0</title>
  <desc id="desc">Les fichiers texte ou Markdown sont découpés en passages et stockés dans SQLite FTS5. FastAPI lance un classement BM25 et retourne jusqu’à cinq extraits originaux avec leur source pour validation humaine.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#27446d" stroke-width="1.5"/></marker></defs>
  <rect width="1000" height="370" fill="#ffffff" rx="10"/>
  <g font-family="Avenir Next,Avenir,Segoe UI,sans-serif" text-anchor="middle">
    <text x="500" y="38" font-size="13" fill="#617289">CHAMDOCS 0.4.0 · RECHERCHE LOCALE SANS MODÈLE NI GÉNÉRATION</text>
    <g fill="#d7ebf4" stroke="#bdd8e5"><rect x="25" y="92" width="160" height="92" rx="8"/><rect x="220" y="92" width="160" height="92" rx="8"/><rect x="415" y="92" width="170" height="92" rx="8"/><rect x="620" y="92" width="170" height="92" rx="8"/><rect x="825" y="92" width="150" height="92" rx="8"/></g>
    <g fill="#1e2d43">
      <text x="105" y="127" font-size="17">TXT / Markdown</text><text x="105" y="151" font-size="12">documents UTF-8</text>
      <text x="300" y="127" font-size="17">Découpage</text><text x="300" y="151" font-size="12">passages et titres</text>
      <text x="500" y="127" font-size="17">SQLite FTS5</text><text x="500" y="151" font-size="12">stockage et index</text>
      <text x="705" y="127" font-size="17">BM25</text><text x="705" y="151" font-size="12">classement lexical</text>
      <text x="900" y="127" font-size="17">Top 5</text><text x="900" y="151" font-size="12">extraits sourcés</text>
    </g>
    <g fill="none" stroke="#27446d" stroke-width="2" marker-end="url(#arrow)"><path d="M185 138H210"/><path d="M380 138H405"/><path d="M585 138H610"/><path d="M790 138H815"/></g>
    <rect x="305" y="245" width="390" height="70" rx="8" fill="#edf6fa" stroke="#bdd8e5"/>
    <text x="500" y="273" font-size="17" fill="#1e2d43">FastAPI et interface locale</text><text x="500" y="297" font-size="12" fill="#617289">import · espaces · recherche · provenance · validation humaine</text>
    <path d="M500 235V194" fill="none" stroke="#27446d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="350" font-size="12" fill="#617289">Docker, Kubernetes et CI sont préparés mais ne sont pas encore validés pour cette version.</text>
  </g>
</svg>
